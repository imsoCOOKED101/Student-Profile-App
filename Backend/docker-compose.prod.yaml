# Production stack. Keep .env.production out of source control and set a unique
# APP_KEY, DB_PASSWORD, and MYSQL_ROOT_PASSWORD before starting this stack.
name: student-profile-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: student-profile-api:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_ROOT_PASSWORD: null
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    volumes:
      - app-storage:/var/www/html/storage/app
    networks:
      - laravel

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: student-profile-web:prod
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - laravel

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  app-storage:
    driver: local
  mysql-data:
    driver: local
