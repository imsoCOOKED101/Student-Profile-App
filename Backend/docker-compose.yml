name: student-profile-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: student-profile-api:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-student_profile}
      DB_USERNAME: studentprofile
      DB_PASSWORD: "123456789"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    command:
      - sh
      - -lc
      - >-
        composer install --no-interaction --prefer-dist &&
        php artisan migrate --force &&
        exec php-fpm
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    volumes:
      - ./:/var/www/html
      - vendor-data:/var/www/html/vendor
    networks:
      - laravel

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: student-profile-web:dev
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - laravel

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-student_profile}
      MYSQL_USER: studentprofile
      MYSQL_PASSWORD: "123456789"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3308:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  vendor-data:
    driver: local
  mysql-data:
    driver: local
